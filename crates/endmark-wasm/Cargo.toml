[package]
name = "endmark-wasm"
description = "endmark-core as a WebAssembly module, for the renderer and the demo page"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
endmark-core = { path = "../endmark-core", features = ["json"] }
serde_json = "1"

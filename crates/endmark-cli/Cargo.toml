[package]
name = "endmark"
description = "The endmark command: lint, inspect and revert changes in Endmark files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "text-processing"]
readme = "../../README.md"
# The tests run the fixtures in the repository, which are not part of the package.
exclude = ["tests"]

[[bin]]
name = "endmark"
path = "src/main.rs"

[dependencies]
endmark-core = { path = "../endmark-core", version = "0.1.0", features = ["json"] }
serde_json = "1"

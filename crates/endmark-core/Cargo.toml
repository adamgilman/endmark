[package]
name = "endmark-core"
description = "Reader and writer for Endmark, a collaboration layer for Markdown: scanner, records, state and anchoring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["text-processing", "parser-implementations"]
readme = "README.md"
exclude = ["tests"]

[features]
default = ["commonmark"]
# Cross-checks every record against CommonMark block structure (the `visible-record` finding).
commonmark = ["dep:pulldown-cmark"]
# The JSON form of a document that `endmark status --format json` prints.
json = ["dep:serde_json"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
serde_json = { version = "1", optional = true }

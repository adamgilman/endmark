name: Release

# Pushing a tag such as v0.1.0 builds the binaries, creates a GitHub
# release with them and publishes the crates to crates.io (which needs a
# CARGO_REGISTRY_TOKEN secret). A tag with a hyphen, such as v0.2.0-rc.1, makes a
# pre-release.
#
# It can also be started by hand from the Actions tab. That run builds and
# packages everything but creates no release: a rehearsal.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tag matches the crate version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: check
    # Also run when the check was skipped, which is the rehearsal.
    if: always() && needs.check.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then version="rehearsal"; fi
          name="endmark-$version-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/endmark.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/endmark" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            endmark-*.tar.gz
            endmark-*.zip
          if-no-files-found: error

  crates:
    name: crates.io
    needs: build
    # A tag publishes endmark-core and then endmark. The rehearsal packages
    # and verifies both against a local registry, and uploads nothing.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Dry run
        if: github.event_name != 'push'
        run: cargo publish --workspace --exclude endmark-wasm --locked --dry-run
      - name: Publish
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "the repository has no CARGO_REGISTRY_TOKEN secret" >&2
            exit 1
          fi
          cargo publish --workspace --exclude endmark-wasm --locked

  publish:
    name: Create the release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum endmark-* > SHA256SUMS
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Endmark $GITHUB_REF_NAME" --generate-notes $flags \
            endmark-* SHA256SUMS

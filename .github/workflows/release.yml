name: Release

# Pushing a tag such as v0.1.0 builds the binaries, creates a GitHub
# release with them and publishes the crates to crates.io (which needs a
# CARGO_REGISTRY_TOKEN secret). A tag with a hyphen, such as v0.2.0-rc.1, makes a
# pre-release.
#
# It can also be started by hand from the Actions tab. That run builds and
# packages everything but creates no release: a rehearsal.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tag matches the crate version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: check
    # Also run when the check was skipped, which is the rehearsal.
    if: always() && needs.check.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Signs the macOS binary with the Developer ID certificate and has Apple
      # notarize it, so that Gatekeeper opens a downloaded copy without a
      # warning. A bare binary cannot be stapled: Gatekeeper looks the
      # notarization up online the first time it runs.
      - name: Sign and notarize
        if: runner.os == 'macOS'
        shell: bash
        env:
          BINARY: target/${{ matrix.target }}/release/endmark
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_P12 CERTIFICATE_PASSWORD API_KEY_P8 API_KEY_ID API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "the repository has no APPLE_$name secret" >&2
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep -m1 -o '"Developer ID Application: [^"]*"' | tr -d '"' || true)
          if [ -z "$identity" ]; then
            echo "APPLE_CERTIFICATE_P12 holds no Developer ID Application identity" >&2
            exit 1
          fi

          codesign --force --timestamp --options runtime \
            --identifier io.github.adamgilman.endmark --sign "$identity" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"

          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/api-key.p8"
          ditto -c -k --keepParent "$BINARY" "$RUNNER_TEMP/endmark.zip"
          xcrun notarytool submit "$RUNNER_TEMP/endmark.zip" \
            --key "$RUNNER_TEMP/api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          status=$(jq -r .status "$RUNNER_TEMP/notary.json")
          echo "notarization: $status"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
              --key "$RUNNER_TEMP/api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
            exit 1
          fi
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/api-key.p8"
      - name: Package
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then version="rehearsal"; fi
          name="endmark-$version-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/endmark.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/endmark" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            endmark-*.tar.gz
            endmark-*.zip
          if-no-files-found: error

  crates:
    name: crates.io
    needs: build
    # A tag publishes endmark-core and then endmark. The rehearsal packages
    # and verifies both against a local registry, and uploads nothing.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Dry run
        if: github.event_name != 'push'
        run: cargo publish --workspace --exclude endmark-wasm --locked --dry-run
      - name: Publish
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "the repository has no CARGO_REGISTRY_TOKEN secret" >&2
            exit 1
          fi
          cargo publish --workspace --exclude endmark-wasm --locked

  publish:
    name: Create the release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum endmark-* > SHA256SUMS
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Endmark $GITHUB_REF_NAME" --generate-notes $flags \
            endmark-* SHA256SUMS

name: Demo page

# Builds the demo page and publishes it with GitHub Pages. Started by hand
# from the Actions tab. GitHub Pages must be turned on for the repository
# first, with "GitHub Actions" as its source.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - run: bun install --frozen-lockfile
        working-directory: packages/render
      - run: bun run build
        working-directory: packages/render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The linter's time budget on a 1 MB file (RFC 12.4).
      - run: cargo test --release --test speed -- --ignored --nocapture

  compat:
    name: Renderer compatibility
    # Renders the fixtures through real Markdown engines and fails if one
    # that should hide records shows them (RFC 12.7).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmark-gfm
      - run: pip install -r compat/requirements.txt
      - run: npm install
        working-directory: compat
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --locked
      - run: python3 compat/run.py --require-all

  render:
    name: Renderer, demo page and endmark view
    # Builds the wasm module, the demo and the page of `endmark view`, runs
    # the renderer's tests, and drives both pages in a headless browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      # The page that the binary embeds is committed in crates/endmark-cli/view.
      # This fails when it was built from other sources than the ones in the
      # tree. It compares a hash of the sources, not the built files: this
      # job's rustc and bun need not be the ones that built what is committed,
      # and would produce different bytes. `cargo test` in the other jobs
      # runs the same check.
      - run: cargo test --locked -p endmark --test view_assets
      - run: bun install --frozen-lockfile
        working-directory: packages/render
      # Rebuilds both pages, so the browser tests below run what the sources
      # in the tree produce, with the binary rebuilt around it.
      - run: bun run build
        working-directory: packages/render
      - run: bun run typecheck
        working-directory: packages/render
      - run: bun test
        working-directory: packages/render
      - run: bun run smoke
        working-directory: packages/render
        env:
          CHROMIUM: google-chrome
      # Starts the real `endmark view` and uses its page: writes reach the
      # file on disk, the page follows the file, read-only offers nothing,
      # hostile HTML runs nothing, and no request leaves the server's origin.
      - run: bun run smoke:view
        working-directory: packages/render
        env:
          CHROMIUM: google-chrome

  msrv:
    name: Rust 1.80
    # The oldest toolchain the crates claim to support (rust-version).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.80 --profile minimal && rustup default 1.80
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.os }}
    # Tests and a release binary on all three platforms.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: endmark-${{ matrix.os }}
          path: |
            target/release/endmark
            target/release/endmark.exe
          if-no-files-found: error

[workspace]
resolver = "2"
members = ["crates/endmark-core", "crates/endmark-cli", "crates/endmark-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/adamgilman/endmark"
rust-version = "1.80"
keywords = ["markdown", "review", "comments", "linter", "agents"]

[profile.release]
lto = true
codegen-units = 1
strip = true
